[project]
name = "career-agent"
version = "0.1.0"
description = "Resume ATS Optimizer + Recruiter Outreach system (FastAPI backend)"
authors = [{ name = "Moonshot" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.3",
    # Independent PDF text extractors for the ATS read-back check.
    "pdfminer.six>=20250506",
    "pypdf>=5.4",
    "jinja2>=3.1",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "email-validator>=2.1",
    "dnspython>=2.6",
    "truststore>=0.9",
    "rapidfuzz>=3.9",
    "python-docx>=1.1",
    "google-genai>=0.3",
    "groq>=0.11",
    "github-copilot-sdk>=1.0.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "ruff>=0.6",
]
# LinkedIn DM automation (requires `playwright install chromium` after install).
automation = [
    "playwright>=1.44",
]

[project.scripts]
career-agent = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# PyMuPDF's SWIG bindings emit these on import; they are not actionable.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
