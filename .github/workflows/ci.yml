name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on its own
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # No API keys in CI: tests mock every LLM, SMTP and network call.
      # Tectonic isn't installed, so PDF-rendering tests are skipped.
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on its own
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build  # type-checks (tsc --noEmit) then builds
